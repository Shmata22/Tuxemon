name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer les fichiers
        run: |
          cp buildconfig/buildozer/buildozer.spec buildozer.spec
          cp run_tuxemon.py main.py

      - name: Installer les dépendances de build
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev
          pip3 install --user buildozer cython==0.29.36

      - name: Compiler l'APK (peut prendre 30 à 60 min la 1ère fois)
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          buildozer android debug

      - name: Mettre l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: tuxemon-apk
          path: bin/*.apk
          if-no-files-found: error
